name: Bug
description: 记录可复现的产品、体验或技术问题
title: "[Bug] "
labels: ["BUG"]
body:
  - type: dropdown
    attributes:
      label: Release
      options: [R1.0, R1.1, Backlog]
    validations: { required: true }
  - type: dropdown
    attributes:
      label: 优先级
      options: [P0, P1, P2]
    validations: { required: true }
  - type: textarea
    attributes:
      label: 问题与复现步骤
      placeholder: 页面/功能、操作步骤、实际结果、期望结果
    validations: { required: true }
  - type: checkboxes
    attributes:
      label: 影响检查
      options:
        - label: 已判断视觉、组件、字体或交互规范影响
        - label: 已判断前后端契约影响
        - label: 已关联或计划新增测试用例编号
