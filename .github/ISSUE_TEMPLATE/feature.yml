name: Feature
description: 记录新功能或用户故事
title: "[Feature] "
labels: ["feature"]
body:
  - type: dropdown
    attributes:
      label: Release
      options: [R1.0, R1.1, Backlog]
    validations: { required: true }
  - type: dropdown
    attributes:
      label: 优先级
      options: [P0, P1, P2]
    validations: { required: true }
  - type: textarea
    attributes:
      label: 用户故事与验收标准
      placeholder: 作为……我希望……以便……；写明成功、失败与恢复路径
    validations: { required: true }
  - type: textarea
    attributes:
      label: 影响与测试
      placeholder: 原型页面、视觉/组件/字体影响、前后端契约、测试用例编号
    validations: { required: true }
