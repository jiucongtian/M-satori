server {
  listen 80;
  server_name operations.shenxinyou.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name operations.shenxinyou.com;
  location /operations-api/ { proxy_pass http://127.0.0.1:3210/api/; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; }
  location / { proxy_pass http://127.0.0.1:6900; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
