server {
  listen 80;
  server_name operations.test.shenxinyou.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name operations.test.shenxinyou.com;
  ssl_certificate /etc/letsencrypt/live/operations.test.shenxinyou.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/operations.test.shenxinyou.com/privkey.pem;
  location /operations-api/ { proxy_pass http://127.0.0.1:3210/api/; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-Proto https; }
  location / { proxy_pass http://127.0.0.1:6900; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
