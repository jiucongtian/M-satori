name: satori-test

x-app-environment: &app-environment
  NODE_ENV: test
  HOST: 0.0.0.0
  PORT: 3000
  DATABASE_URL: postgresql://satori:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/satori
  REDIS_URL: redis://redis:6379
  COOKIE_SECURE: 'true'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: satori
      POSTGRES_USER: satori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U satori -d satori']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    image: satori-backend-migrate:test
    env_file: .env.production
    environment: *app-environment
    command: ['node_modules/.bin/tsx', 'scripts/migrate.ts']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: satori-backend:test
    restart: unless-stopped
    env_file: .env.production
    environment: *app-environment
    command: ['node', 'dist/apps/api/src/main.js']
    ports:
      - '127.0.0.1:3200:3000'
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  worker:
    image: satori-backend:test
    restart: unless-stopped
    env_file: .env.production
    environment: *app-environment
    command: ['node', 'dist/apps/worker/src/main.js']
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  seed:
    image: satori-backend-migrate:test
    env_file: .env.production
    environment: *app-environment
    command: ['node_modules/.bin/tsx', 'scripts/seed-legal-documents.ts']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
