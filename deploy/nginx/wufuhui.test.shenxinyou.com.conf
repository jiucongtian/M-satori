server { listen 80; server_name wufuhui.test.shenxinyou.com; return 301 https://$host$request_uri; }
server {
    listen 443 ssl; http2 on; server_name wufuhui.test.shenxinyou.com;
    ssl_certificate /etc/nginx/ssl/shenxinyou.com/wildcard_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/shenxinyou.com/wildcard.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /opt/satori-test/wufuhui-frontend/current; index index.html;
    location /api/v1/ { proxy_pass http://127.0.0.1:3220; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_set_header Connection ''; proxy_buffering off; proxy_read_timeout 300s; }
    location /_next/static/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri.html $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
