server {
    listen 80;
    server_name test-satori.shenxinyou.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name test-satori.shenxinyou.com;

    ssl_certificate /etc/nginx/ssl/shenxinyou.com/wildcard_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/shenxinyou.com/wildcard.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/test-satori-access.log;
    error_log /var/log/nginx/test-satori-error.log;
    client_max_body_size 256k;
    root /opt/satori-test/frontend/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/(?:cards|contact|fonts)/.*\.(?:jpe?g|png|svg|webp|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        # Next static export emits both route.html and route/ RSC data folders.
        # Prefer the HTML document so /login does not redirect into a directory
        # without an index file and return 403.
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
