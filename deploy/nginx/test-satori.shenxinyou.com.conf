server {
    listen 80;
    server_name test-satori.shenxinyou.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name test-satori.shenxinyou.com;

    ssl_certificate /etc/nginx/ssl/shenxinyou.com/wildcard_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/shenxinyou.com/wildcard.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/test-satori-access.log;
    error_log /var/log/nginx/test-satori-error.log;
    client_max_body_size 256k;

    location = / {
        return 302 /api/v1/health/ready;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
